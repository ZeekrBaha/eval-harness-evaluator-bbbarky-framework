[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-harness-evaluator-bbbarky-framework"
version = "0.1.0"
description = "Provider-agnostic evaluation framework for LLM agents: LLM-as-judge, pattern, and hybrid evaluators with a YAML-driven runner, reporting, and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bbbarky" }]
keywords = ["evaluation", "llm", "agents", "llm-as-judge", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "litellm>=1.75.5",
    "rich>=13.0.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
adk = ["google-adk>=1.22.0"]
phoenix = [
    "arize-phoenix-client",
    "arize-phoenix-otel",
    "openinference-instrumentation-google-adk",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
eval-harness = "eval_harness_evaluator_bbbarky_framework.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness_evaluator_bbbarky_framework"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
